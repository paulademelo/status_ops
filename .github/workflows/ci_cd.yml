name: CI/CD - Flutter StatusOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Evita dois deploys simultâneos no GitHub Pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # CI: roda em todo push e pull request. Se algo falhar aqui, nada é publicado.
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 CI - Qualidade e testes
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.report.outputs.passed }}
      total: ${{ steps.report.outputs.total }}
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v5

      - name: 🐦 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9 # mesma versão do seu Mac (flutter --version)
          cache: true

      - name: 📦 Baixar dependências
        run: flutter pub get

      - name: 🎨 Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔍 Análise estática
        run: flutter analyze

      - name: 🧪 Rodar testes
        run: flutter test --file-reporter json:test-report.json

      - name: 📊 Resumo dos testes
        id: report
        run: |
          PASSED=$(jq -s '[.[] | select(.type == "testDone" and .hidden == false and .result == "success")] | length' test-report.json)
          TOTAL=$(jq -s '[.[] | select(.type == "testDone" and .hidden == false)] | length' test-report.json)
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "### 🧪 Testes: $PASSED/$TOTAL passando" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CD (parte 1): build de produção. Só roda em push na main com o CI verde.
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Build web
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 10 # precisamos dos últimos commits para o histórico

      - name: 🐦 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9 # mesma versão do seu Mac (flutter --version)
          cache: true

      - name: 📦 Baixar dependências
        run: flutter pub get

      - name: ⚙️ Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 🧾 Gerar build_info.json
        env:
          TESTS_PASSED: ${{ needs.test.outputs.passed }}
          TESTS_TOTAL: ${{ needs.test.outputs.total }}
        run: |
          COMMITS=$(git log -5 --date=format-local:'%d/%m/%Y %H:%M' --pretty=format:'%h%x1f%s%x1f%an%x1f%ad' \
            | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\u001f") | {sha: .[0], message: .[1], author: .[2], date: .[3]})')

          jq -n \
            --arg sha "$(git rev-parse --short=7 HEAD)" \
            --arg message "$(git log -1 --pretty=%s)" \
            --arg author "$(git log -1 --pretty=%an)" \
            --arg run "$GITHUB_RUN_NUMBER" \
            --arg date "$(date '+%d/%m/%Y %H:%M')" \
            --arg passed "$TESTS_PASSED" \
            --arg total "$TESTS_TOTAL" \
            --arg commits "$COMMITS" \
            '{
              COMMIT_SHA: $sha,
              COMMIT_MESSAGE: $message,
              COMMIT_AUTHOR: $author,
              RUN_NUMBER: $run,
              BUILD_DATE: $date,
              TESTS_PASSED: $passed,
              TESTS_TOTAL: $total,
              RECENT_COMMITS: $commits
            }' > build_info.json

          cat build_info.json

      - name: 🏗️ flutter build web
        run: >
          flutter build web --release
          --base-href "${{ steps.pages.outputs.base_path }}/"
          --dart-define-from-file=build_info.json

      - name: 📤 Enviar artefato para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  # ---------------------------------------------------------------------------
  # CD (parte 2): publica no GitHub Pages.
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Publicar
        id: deployment
        uses: actions/deploy-pages@v4
