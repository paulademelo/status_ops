name: CI/CD - Flutter StatusOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.tests.outputs.passed }}
      total: ${{ steps.tests.outputs.total }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: flutter test
        id: tests
        run: |
          flutter test --file-reporter json:report.json
          echo "passed=$(jq -s '[.[] | select(.type=="testDone" and .hidden==false and .result=="success")] | length' report.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(jq -s '[.[] | select(.type=="testDone" and .hidden==false)] | length' report.json)" >> "$GITHUB_OUTPUT"

  build:
    name: 🏗️ Build
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: flutter build web
        env:
          TZ: America/Sao_Paulo
          TESTS_PASSED: ${{ needs.test.outputs.passed }}
          TESTS_TOTAL: ${{ needs.test.outputs.total }}
        run: |
          flutter build web --release \
            --base-href "${{ steps.pages.outputs.base_path }}/" \
            --dart-define=COMMIT_SHA="$(git rev-parse --short HEAD)" \
            --dart-define=COMMIT_MESSAGE="$(git log -1 --pretty=%s)" \
            --dart-define=COMMIT_AUTHOR="$(git log -1 --pretty=%an)" \
            --dart-define=RUN_NUMBER="$GITHUB_RUN_NUMBER" \
            --dart-define=BUILD_DATE="$(date '+%d/%m/%Y %H:%M')" \
            --dart-define=TESTS_PASSED="$TESTS_PASSED" \
            --dart-define=TESTS_TOTAL="$TESTS_TOTAL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4